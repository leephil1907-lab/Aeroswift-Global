services:
  - type: web
    name: aeroswift-global
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aeroswift-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_HOST
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AEROSWIFT_ENQUIRY_TO
        sync: false
      - key: AEROSWIFT_ENQUIRY_FROM
        sync: false
      - key: KARRIO_API_URL
        sync: false
      - key: KARRIO_API_KEY
        sync: false

databases:
  - name: aeroswift-db
    databaseName: aeroswift
    user: aeroswift
    plan: basic_256mb
    region: frankfurt
    postgresMajorVersion: 18
    diskSizeGB: 1
